# Generates the images shown on the profile README (stats, languages,
# pinned repos, contribution snake) and commits them to profile/.
# Static SVGs replace the public github-readme-stats instance, which
# rate-limits and shows "Something went wrong" cards.
name: Update profile

on:
  schedule:
    - cron: "0 6 * * *" # daily, 03:00 in Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

env:
  # Transparent background and mid-tone text, so one card reads on both
  # GitHub's light and dark themes.
  CARD_STYLE: "bg_color=00000000&hide_border=true&title_color=f97316&icon_color=f97316&ring_color=f97316&text_color=6e7681"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - run: mkdir -p profile

      # fail_on_error + continue-on-error: when the GitHub API fails, keep the
      # previous SVG instead of committing an error card.
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        continue-on-error: true
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&${{ env.CARD_STYLE }}"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        continue-on-error: true
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=html,css,less,blade&${{ env.CARD_STYLE }}"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin card - Mods-for-Idle-Slayer
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        continue-on-error: true
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=Mods-for-Idle-Slayer&${{ env.CARD_STYLE }}"
          path: profile/pin-mods-for-idle-slayer.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin card - tuya-local
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        continue-on-error: true
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=tuya-local&${{ env.CARD_STYLE }}"
          path: profile/pin-tuya-local.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin card - SoundSpotFrontend
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        continue-on-error: true
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=SoundSpotFrontend&${{ env.CARD_STYLE }}"
          path: profile/pin-soundspot-frontend.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin card - SoundSpotBackend
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        continue-on-error: true
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=SoundSpotBackend&${{ env.CARD_STYLE }}"
          path: profile/pin-soundspot-backend.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?palette=github-light&color_snake=#f97316
            profile/snake-dark.svg?palette=github-dark&color_snake=#f97316

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update profile images"
          git pull --rebase
          git push
